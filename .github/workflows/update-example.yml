name: Update SDK Version

on:
  repository_dispatch:
    types: [android-sdk-release]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_RELEASE_PAT }}

      - name: Extract version
        id: version
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in dispatch payload: $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update example app SDK version
        run: |
          sed -i 's/implementation("io.refiner:refiner:[^"]*")/implementation("io.refiner:refiner:${{ steps.version.outputs.VERSION }}")/' example/androidApp/build.gradle.kts

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ steps.version.outputs.VERSION }}"
          git tag "${{ steps.version.outputs.VERSION }}"
          git push origin main --tags

      # Public release notes are reviewed and published by hand: create a DRAFT with the
      # change list the SDK repo sent in the dispatch payload (CHANGELOG section).
      - name: Write release notes
        env:
          NOTES: ${{ github.event.client_payload.notes }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          else
            echo "Refiner Android SDK $VERSION. See the CHANGELOG in the SDK repository for details." > "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
